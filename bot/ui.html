<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}}</title>
<style>
:root{
  --ground:#f3f5f0; --surface:#fff; --line:#dde2d8;
  --ink:#171c15; --dim:#5f6b5c; --faint:#8b9687;
  --jade:#2f7a4a; --jade-soft:#e2f0e6; --alert:#a33a2c;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ground:#0f130e; --surface:#171c15; --line:#2b3328;
  --ink:#e7eae2; --dim:#9aa596; --faint:#6d776a;
  --jade:#6cc088; --jade-soft:#1c2c20; --alert:#e08272;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); display:flex; flex-direction:column;
  font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

header{padding:18px 20px 14px; text-align:center; flex:none}
h1{font-size:19px; margin:0; font-weight:600}
header p{margin:3px 0 0; font-size:13.5px; color:var(--faint)}

#log{flex:1; overflow-y:auto; padding:8px 20px 20px;
  display:flex; flex-direction:column; gap:14px; max-width:620px; width:100%; margin:0 auto}
.turn{display:flex; flex-direction:column; gap:5px; max-width:86%}
.turn.mine{align-self:flex-end; align-items:flex-end}
.bubble{padding:10px 15px; border-radius:17px; white-space:pre-wrap; word-break:break-word}
.turn.hers .bubble{background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px}
.turn.mine .bubble{background:var(--jade-soft); border-bottom-right-radius:5px}
.why{font-size:12.5px; color:var(--faint)}
.why.stop{color:var(--alert)}
.hello{margin:auto; text-align:center; color:var(--faint); font-size:14.5px; max-width:290px}

form{flex:none; display:flex; gap:9px; padding:14px 20px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line); background:var(--surface);
  max-width:620px; width:100%; margin:0 auto}
input[type=text]{flex:1; min-width:0; padding:12px 14px; border:1px solid var(--line);
  border-radius:10px; background:var(--ground); color:var(--ink); font:inherit}
input[type=text]:focus{outline:2px solid var(--jade); outline-offset:-1px}
button{font:inherit; cursor:pointer}
.send{border:0; border-radius:10px; background:var(--jade); color:#fff; padding:12px 18px; font-weight:500}
.send:disabled{opacity:.45; cursor:default}

.links{flex:none; text-align:center; padding:0 20px 16px; font-size:13.5px}
.links button{background:none; border:0; color:var(--faint); text-decoration:underline;
  padding:4px 8px; font-size:13.5px}
.links button:hover{color:var(--ink)}

#panel{flex:none; border-top:1px solid var(--line); background:var(--surface);
  padding:18px 20px; max-width:620px; width:100%; margin:0 auto; max-height:55%; overflow-y:auto}
#panel[hidden]{display:none}
#panel h2{font-size:14px; margin:0 0 4px; font-weight:600}
#panel p.help{margin:0 0 12px; font-size:13px; color:var(--faint)}
label{display:block; font-size:12.5px; color:var(--dim); margin:14px 0 5px}
textarea{width:100%; border:1px solid var(--line); border-radius:8px; background:var(--ground);
  color:var(--ink); font:13.5px/1.7 inherit; padding:10px; resize:vertical}
textarea:focus{outline:2px solid var(--jade); outline-offset:-1px}
.actions{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap}
.save{border:0; border-radius:8px; background:var(--jade); color:#fff; padding:10px 16px; font-weight:500}
.actions label{margin:0; display:flex; align-items:center; gap:6px}
.done{color:var(--jade); font-size:13px}

#feed{flex:1; overflow-y:auto; padding:8px 20px 20px; max-width:620px; width:100%; margin:0 auto}
#feed[hidden]{display:none}
.post{padding:15px 0; border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post p{margin:0; font-size:16.5px}
.post span{display:block; margin-top:5px; color:var(--faint); font-size:12.5px; overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<header>
  <h1>{{NAME}}</h1>
  <p>{{MODE}}</p>
</header>

<div id="log"></div>
<div id="feed" hidden></div>

<form id="composer">
  <input type="text" id="box" placeholder="Say something" autocomplete="off">
  <button class="send" type="submit" id="send">Send</button>
</form>

<p class="links">
  <button id="showVoice">Edit her voice</button>
  <button id="showFeed">Her captions</button>
  <button id="reset">Start over</button>
</p>

<aside id="panel" hidden>
  <h2>Her voice</h2>
  <p class="help">Change these, then talk to her again. Nothing is saved to disk
  unless you tick the box.</p>
  <label for="rules">Rules she writes by, one per line</label>
  <textarea id="rules" rows="8"></textarea>
  <label for="facts">Things that are true about her</label>
  <textarea id="facts" rows="5"></textarea>
  <div class="actions">
    <button class="save" id="save">Use these</button>
    <label><input type="checkbox" id="persist"> keep them</label>
    <span class="done" id="done"></span>
  </div>
</aside>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

function note(m){
  if (!m.ann || !m.ann.length) return '';
  const stop = m.ann.some(a => a.kind === 'stop');
  return `<div class="why${stop ? ' stop' : ''}">${esc(m.ann.map(a => a.text).join(' · '))}</div>`;
}

async function refresh(){
  const [s, f] = await Promise.all([
    (await fetch('/api/state')).json(),
    (await fetch('/api/timeline')).json(),
  ]);

  $('log').innerHTML = s.messages.length
    ? s.messages.map(m => `<div class="turn ${m.direction === 'in' ? 'mine' : 'hers'}">`
        + `<div class="bubble">${esc(m.body)}</div>${note(m)}</div>`).join('')
    : '<p class="hello">Say hi. Or ask her if she\'s real, and watch what she does.</p>';
  $('log').scrollTop = $('log').scrollHeight;

  $('feed').innerHTML = f.posts.length
    ? f.posts.map(p => `<article class="post"><p>${esc(p.caption)}</p>`
        + `<span>${esc(p.image)}</span></article>`).join('')
    : '<p class="hello">No captions yet. Run <code>python -m bot caption &lt;folder&gt;</code>.</p>';

  if (document.activeElement !== $('rules')) $('rules').value = s.rules.join('\n');
  if (document.activeElement !== $('facts')) $('facts').value = s.facts.join('\n');
}

$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('box').value.trim();
  if (!text) return;
  $('box').value = ''; $('send').disabled = true;
  try {
    await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})});
    await refresh();
  } finally { $('send').disabled = false; $('box').focus(); }
});

$('showVoice').addEventListener('click', () => {
  $('panel').hidden = !$('panel').hidden;
  $('showVoice').textContent = $('panel').hidden ? 'Edit her voice' : 'Hide her voice';
});

$('showFeed').addEventListener('click', () => {
  const toFeed = $('feed').hidden;
  $('feed').hidden = !toFeed;
  $('log').hidden = toFeed;
  $('composer').hidden = toFeed;
  $('showFeed').textContent = toFeed ? 'Back to chat' : 'Her captions';
});

$('save').addEventListener('click', async () => {
  const r = await (await fetch('/api/persona', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      rules: $('rules').value.split('\n').map(s => s.trim()).filter(Boolean),
      facts: $('facts').value.split('\n').map(s => s.trim()).filter(Boolean),
      save: $('persist').checked,
    })})).json();
  $('done').textContent = r.ok ? (r.written ? 'saved' : 'using them') : 'that broke something';
  setTimeout(() => { $('done').textContent = ''; }, 2500);
  await refresh();
});

$('reset').addEventListener('click', async () => {
  await fetch('/api/reset', {method:'POST'});
  await refresh();
});

refresh();
</script></body></html>
