# Bipbip default configuration.
# Copy to config/local.yaml and edit; local.yaml overrides these and is gitignored.

account:
  # "cash" enforces T+1 settlement and one round-trip per session (no shorting).
  # "margin_pdt" enforces 3 day-trades per rolling 5 sessions.
  # "margin_full" applies no turnover limit.
  type: cash
  starting_equity: 10000.0
  # Fraction of settled cash committed to a single trade.
  max_position_pct: 0.95
  # Webull supports fractional shares on most US stocks and ETFs. Whole-share
  # sizing leaves the remainder idle - $176 of a $9,500 budget at SPY's price.
  allow_fractional: true

session:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  # Refuse to open new positions after this time; the day's edge is gone and
  # a position opened here cannot reach its target hold before the close.
  no_new_entries_after: "15:00"
  # Force-flat every position at this bar. Non-negotiable for an intraday system.
  force_flat_at: "15:55"

costs:
  # Webull charges no commission on US stocks/ETFs.
  commission_per_trade: 0.0
  # Regulatory fees, charged on SELLS only and passed through by the broker
  # rather than earned by it. They are small: about $0.26 per round trip on a
  # $9,500 position, or 12% of SPY's total trading cost. Set both to 0.0 if
  # your statements genuinely show none.
  #
  # They are NOT the main cost. The spread is - 88% of the total - and it is
  # not a fee: you buy at the ask and sell at the bid whoever your broker is.
  # A commission-free broker does not make trading free.
  #
  # NOTE: the SEC rate is reset annually; verify before trusting live P&L.
  sec_fee_per_million: 27.80
  finra_taf_per_share: 0.000166
  finra_taf_max: 8.30
  # Modelled execution friction, in basis points, applied to every fill.
  # Half the quoted spread plus expected adverse movement during order latency.
  slippage_bps:
    SPY: 1.0
    TQQQ: 2.5
    default: 3.0

data:
  store_dir: data/bars
  symbols: [SPY, TQQQ]
  bar_size: 1m
