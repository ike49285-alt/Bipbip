<title>Thirsttrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f2f1f4; --panel:#fff; --sunk:#eceaf0;
  --ink:#221d28; --muted:#6f6878; --faint:#948da0;
  --line:#e2dfe8; --accent:#a8324f; --accent-soft:#f5e6ea; --good:#3f7a63;
  --display:"Instrument Serif",Georgia,serif;
  --ui:"Karla",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16131a; --panel:#1e1a23; --sunk:#191620;
    --ink:#ece8f0; --muted:#928b9c; --faint:#6d6678;
    --line:#2e2836; --accent:#e2637f; --accent-soft:#2a1d24; --good:#6fb394;
  }
}
:root[data-theme="dark"]{
  --bg:#16131a; --panel:#1e1a23; --sunk:#191620;
  --ink:#ece8f0; --muted:#928b9c; --faint:#6d6678;
  --line:#2e2836; --accent:#e2637f; --accent-soft:#2a1d24; --good:#6fb394;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
.shell{max-width:1080px;margin:0 auto;padding:28px 20px 190px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.mark{font-family:var(--display);font-size:38px;line-height:1;letter-spacing:-.01em}
.mark em{font-style:italic;color:var(--accent)}
.status{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.7}
.status b{color:var(--ink);font-weight:500}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;align-items:start}
@media (max-width:820px){ .grid{grid-template-columns:minmax(0,1fr);gap:24px} }

.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:700;margin:0 0 10px}

.turn{margin-bottom:26px}
.said{display:flex;gap:8px;align-items:baseline;margin-bottom:12px}
.said .caret{color:var(--accent);font-family:var(--mono);font-size:13px}
.said .words{font-size:16px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:8px}

.post{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.post:first-of-type{border-top:none}
.rankno{font-family:var(--mono);font-size:12px;color:var(--faint);padding-top:3px}
.score{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.score small{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--faint);margin-top:3px;text-transform:uppercase}
.body{font-size:16.5px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}
.flag{font-size:11px;font-family:var(--mono);color:var(--faint)}
.flag.warn{color:var(--accent)}
.row.notes{margin-top:6px;gap:12px}
.chars{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--muted);padding:3px 11px;font-size:12.5px;font-weight:500}
button:hover{color:var(--ink);border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.keep{border-color:var(--accent);color:var(--accent)}
button.keep[disabled]{opacity:.45;cursor:default;border-color:var(--line);color:var(--faint)}
button.why{padding:3px 8px}

.bars{margin-top:11px;padding:11px 13px;background:var(--sunk);border-radius:8px}
.cbar{display:grid;grid-template-columns:96px 1fr 38px;gap:9px;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);padding:2px 0}
.track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px}
.cbar .n{text-align:right;font-variant-numeric:tabular-nums}

.rail{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:20px}
@media (max-width:820px){ .rail{position:static} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.rule{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0;color:var(--ink)}
.rule button{border:none;padding:0 2px;font-size:14px;line-height:1;color:var(--faint)}
.rule button:hover{color:var(--accent)}
.wrow{display:grid;grid-template-columns:82px 1fr 44px;gap:8px;align-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:2.5px 0}
.wtrack{height:4px;background:var(--line);border-radius:2px;position:relative}
.wfill{position:absolute;top:0;bottom:0;background:var(--muted);border-radius:2px}
.wdelta{text-align:right;font-variant-numeric:tabular-nums}
.wdelta.up{color:var(--good)} .wdelta.down{color:var(--accent)}
.keptline{font-size:13px;padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.keptline:first-of-type{border-top:none}
.empty{color:var(--faint);font-size:13px}

.composer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.composer .inner{max-width:1080px;margin:0 auto}
.composer form{display:flex;gap:9px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.go{border-color:var(--accent);color:var(--accent);padding:0 18px;font-weight:600}
.go[disabled]{opacity:.5;cursor:default}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.quick button{font-size:11.5px;padding:2px 9px;color:var(--faint)}
.msg{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:9px;white-space:pre-wrap}
.thinking{color:var(--muted);font-family:var(--mono);font-size:13px}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){ .dots::after{content:"..."} ; *{animation:none!important} }
</style>

<div class="shell">
  <header>
    <div class="mark">thirst<em>trap</em></div>
    <div class="status">
      <div id="st-engine">checking for Claude…</div>
      <div id="st-tune"><b>untuned</b> · 0 keeps</div>
    </div>
  </header>

  <div class="grid">
    <main>
      <p class="eyebrow">Transcript</p>
      <div id="stream"></div>
      <div id="pending" hidden class="turn">
        <div class="thinking"><span class="dots">Writing</span></div>
      </div>
    </main>

    <aside class="rail">
      <div class="card">
        <p class="eyebrow">Standing rules</p>
        <div id="rules"><p class="empty">None yet. Say “never use exclamation marks”.</p></div>
      </div>
      <div class="card">
        <p class="eyebrow">Learned weights</p>
        <div id="weights"></div>
      </div>
      <div class="card">
        <p class="eyebrow">Kept</p>
        <div id="kept"><p class="empty">Nothing kept yet.</p></div>
      </div>
    </aside>
  </div>
</div>

<div class="composer">
  <div class="inner">
    <form id="form">
      <input type="text" id="line" autocomplete="off" spellcheck="false"
             placeholder="A topic — or: shorter · no questions · more like 2 · never use exclamation marks">
      <button class="go" type="submit" id="go">Write</button>
    </form>
    <div class="quick" id="quick"></div>
    <div class="msg" id="msg" hidden></div>
  </div>
</div>

<script>
"use strict";

/* ---------- scorer: a faithful port of score.py ---------- */
const WEIGHTS = {hook:.20, length:.14, direct_address:.12, curiosity:.12,
                 restraint:.12, concreteness:.10, rhythm:.10, freshness:.10};
const MAX_CHARS = 280;

const CONTRARIAN = new Set(["nobody","everyone","most","stop","never","unpopular","worst","hardest","truth","reminder","psa","hot"]);
const QUESTIONW  = new Set(["what","why","how","who","when","where","which"]);
const HEDGES     = new Set(["i","just","maybe","perhaps","kinda","sorta","honestly","basically","literally","actually","personally","arguably","probably","somewhat"]);
const SECOND     = new Set(["you","your","youre","yours","yourself","u","ur"]);
const OPEN_LOOP  = ["nobody tells you","no one tells you","here's why","heres why","the reason","what happens","turns out","and yet","until you","the part nobody","watch what","wait for","the trick"];
const CLICHES    = ["game changer","game-changer","let that sink in","who else","read that again","needless to say","at the end of the day","thoughts?","am i right","drop a","like and retweet","rt if","you won't believe","you wont believe","this is everything","living rent free","main character","it's giving","its giving","no because","the way i","i can't even","i cant even"];
const ABSTRACT   = ["ness","ity","tion","sion","ment","ance","ence","ism"];

const EMOJI_RE = /\p{Extended_Pictographic}/u;
const EMOJI_G  = /\p{Extended_Pictographic}/gu;
const URL_RE   = /https?:\/\/\S+|\bwww\.\S+/gi;
const HASH_RE  = /(?:^|\s)#\w+/g;
const WORD_RE  = /[A-Za-z0-9']+/g;

const SHORT = {hook:"hook", length:"length", direct_address:"direct", curiosity:"curiosity",
               restraint:"restraint", concreteness:"concrete", rhythm:"rhythm", freshness:"freshness"};
const clamp = v => Math.max(0, Math.min(1, v));
const ramp  = (v, lo, hi) => lo === hi ? (v >= hi ? 1 : 0) : clamp((v - lo) / (hi - lo));
const words = t => t.match(WORD_RE) || [];
const norm  = w => w.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/'/g, "");
const sentences = t => t.split(/[.!?\n]+/).map(s => s.trim()).filter(Boolean);

function scoreLength(t){
  const n = t.trim().length;
  if (n > MAX_CHARS) return 0;
  if (n < 60) return ramp(n, 12, 60);
  if (n <= 140) return 1;
  return ramp(n, MAX_CHARS, 140);
}
function scoreHook(t){
  const w = words(t).slice(0, 8).map(norm);
  if (!w.length) return 0;
  let s = .35; const first = w[0];
  if (SECOND.has(first)) s += .35;
  else if (CONTRARIAN.has(first)) s += .30;
  else if (QUESTIONW.has(first)) s += .25;
  else if (/^\d+$/.test(first)) s += .25;
  else if (HEDGES.has(first)) s -= .25;
  if (w.slice(1).some(x => SECOND.has(x))) s += .15;
  if (w.slice(1).some(x => CONTRARIAN.has(x))) s += .10;
  if (w.some(x => /^\d+$/.test(x))) s += .10;
  return clamp(s);
}
function scoreDirect(t){
  const hits = words(t).filter(w => SECOND.has(norm(w))).length;
  if (!hits) return .15;
  if (hits <= 3) return 1;
  return clamp(1 - .15 * (hits - 3));
}
function scoreCuriosity(t){
  const low = t.toLowerCase(); let s = .3;
  const q = (t.match(/\?/g) || []).length;
  if (q === 1) s += .3; else if (q >= 2) s += .1;
  s += Math.min(.35, .18 * OPEN_LOOP.filter(p => low.includes(p)).length);
  if (t.includes("...") || t.includes("…")) s += .1;
  return clamp(s);
}
function scoreConcrete(t){
  const w = words(t);
  if (!w.length) return 0;
  let s = .4;
  if (w.some(x => /^\d+$/.test(x))) s += .3;
  s -= .2 * w.filter(x => x.length > 6 && ABSTRACT.some(suf => norm(x).endsWith(suf))).length;
  s += Math.min(.2, .1 * w.slice(1).filter(x => x[0] === x[0].toUpperCase() && x !== x.toUpperCase()).length);
  return clamp(s);
}
function scoreRhythm(t){
  const s = sentences(t);
  if (!s.length) return 0;
  if (s.length === 1) return .6;
  if (s.length > 4) return .35;
  const len = s.map(x => words(x).length);
  const closing = len[len.length - 1];
  const earlier = len.slice(0, -1).reduce((a, b) => a + b, 0) / (len.length - 1);
  if (!closing) return .5;
  if (closing < earlier * .7) return 1;
  if (closing < earlier) return .8;
  return .55;
}
function scoreRestraint(t){
  let s = 1; const notes = [];
  const emoji = (t.match(EMOJI_G) || []).length;
  if (emoji > 2){ s -= .15 * (emoji - 2); notes.push(emoji + " emoji (2 is the ceiling)"); }
  const hash = (t.match(HASH_RE) || []).length;
  if (hash){ s -= .30 * hash; notes.push(hash + " hashtag" + (hash > 1 ? "s" : "") + " — these suppress reach"); }
  const links = (t.match(URL_RE) || []).length;
  if (links){ s -= .35 * links; notes.push("off-platform link — put it in a reply"); }
  const ex = (t.match(/!/g) || []).length;
  if (ex > 1){ s -= .12 * (ex - 1); notes.push(ex + " exclamation marks"); }
  const shout = words(t).filter(w => w.length > 2 && w === w.toUpperCase() && /[A-Z]/.test(w));
  if (shout.length > 1){ s -= .12 * shout.length; notes.push(shout.length + " all-caps words"); }
  return [clamp(s), notes];
}
function scoreFresh(t){
  const low = t.toLowerCase();
  const hits = CLICHES.filter(c => low.includes(c));
  return [clamp(1 - .3 * hits.length), hits.map(h => "cliché: “" + h + "”")];
}
function normaliseWeights(w){
  const clean = {}; let total = 0;
  for (const k in WEIGHTS){ const v = Math.max(0, Number(w?.[k] ?? WEIGHTS[k]) || 0); clean[k] = v; total += v; }
  if (total <= 0) return {...WEIGHTS};
  for (const k in clean) clean[k] /= total;
  return clean;
}
function scorePost(text, weights){
  const [restraint, rNotes] = scoreRestraint(text);
  const [freshness, fNotes] = scoreFresh(text);
  const c = {
    hook: scoreHook(text), length: scoreLength(text), direct_address: scoreDirect(text),
    curiosity: scoreCuriosity(text), restraint, concreteness: scoreConcrete(text),
    rhythm: scoreRhythm(text), freshness,
  };
  const notes = rNotes.concat(fNotes);
  if (text.trim().length > MAX_CHARS) notes.push(text.trim().length + " chars — over the " + MAX_CHARS + " limit");
  const active = weights ? normaliseWeights(weights) : WEIGHTS;
  let total = 0;
  for (const k in WEIGHTS) total += c[k] * active[k];
  return {total: 100 * total, components: c, notes};
}

/* ---------- ranking: port of rank.py ---------- */
const STOP = new Set("a an and are as at be but by for from had has have he her his i if in is it its me my not of on or she so that the their them they this to was we were what when who will with you your".split(" "));
const toks = t => new Set((t.toLowerCase().match(/[a-z0-9']+/g) || []).filter(x => !STOP.has(x)));
function similarity(a, b){
  const A = toks(a), B = toks(b);
  if (!A.size || !B.size) return 0;
  let inter = 0; for (const x of A) if (B.has(x)) inter++;
  return inter / (A.size + B.size - inter);
}
function rank(cands, weights, novelty = .35){
  const scored = cands.map(t => ({text: t, score: scorePost(t, weights)}));
  scored.sort((x, y) => y.score.total - x.score.total);
  const out = [];
  for (const item of scored){
    let worst = 0;
    for (const kept of out) worst = Math.max(worst, similarity(item.text, kept.text));
    out.push({...item, novelty: 1 - worst, final: item.score.total * (1 - novelty * worst), dup: worst > .25});
  }
  out.sort((a, b) => b.final - a.final);
  return out;
}

/* ---------- directives: port of directives.py ---------- */
const PERSONAS = {
  flirt:"Playful and confident. Teasing rather than pleading — the voice of someone who assumes interest rather than asking for it. Suggestive through implication and restraint, never through description.",
  soft:"Quiet and intimate, like a text sent at 1am rather than a broadcast. Small concrete details over grand statements. No exclamation marks.",
  chaos:"Unhinged but in control of the joke. Self-aware about being online. Willing to look ridiculous, never willing to look earnest.",
  deadpan:"Dry and understated. One line, no wind-up, no explanation after the punch. Understatement is the entire move.",
  flex:"Confident about something real and specific. The brag is buried in a detail rather than announced.",
  soft_launch:"Deliberately under-explained. Implies a story the reader has to reconstruct. The withheld information is the point.",
  gym:"Training and physical effort as the source of the confidence. The discipline is the attractive part, not the body. Specific numbers, no motivational-poster language.",
};
const RULES_TXT = [
  "Every post stands alone. No threads, no numbering, no \"1/\".",
  "No hashtags. No @-mentions. No URLs.",
  "Under 280 characters. Most should be well under.",
  "Subjects are adults. Nothing sexual about anyone who could read as underage.",
  "Suggestive through implication and restraint only. Nothing sexually explicit or anatomical.",
  "Never write as, quote, or reference a real named person.",
  "Confidence, never neediness. No begging for engagement, no fishing for compliments.",
  "Never demean anyone, including the reader.",
];
const NEG = "(?:no|never|not|stop|without|don'?t|drop the|lose the)\\b[^.?!]{0,24}?";
const ADJUST = [
  [/\b(much|way|far)\s+(shorter|tighter|briefer)\b/, {maxChars:60}],
  [/\b(shorter|tighter|briefer|trim|cut it down|less wordy)\b/, {maxChars:95}],
  [/\b(much|way|far)\s+longer\b/, {minChars:160}],
  [/\b(longer|more detail|flesh it out)\b/, {minChars:120}],
  [/\b(one|single)\s+(line|sentence)\b|\bone-liner\b/, {maxSentences:1}],
  [/\bno\s+questions?\b|\bstop\s+asking\b|\bdon'?t\s+ask\b/, {questions:false}],
  [/\bask\s+(a\s+)?questions?\b|\bmake\s+it\s+a\s+question\b/, {questions:true}],
  [/\bno\s+(numbers?|numerals?|digits?)\b/, {numerals:false}],
  [new RegExp(NEG + "\\bemoji\\w*\\b"), {emoji:false}],
];
const BANS = [
  [new RegExp(NEG + "\\bexclamation|\\bstop\\s+(?:shouting|yelling)\\b"), "!"],
  [new RegExp(NEG + "\\bhashtags?\\b"), "#"],
];
const STANDING_RE = /\b(never|always|from now on|every time|going forward|stop using|i hate|i don'?t want|don'?t ever)\b/;
const LIKE_RE = /\b(?:more\s+like|like|similar to)\s+#?(\d+)\b/;
const BANQ_RE = /\b(?:never|stop|don'?t|avoid)\s+(?:say(?:ing)?|us(?:e|ing)|writ(?:e|ing))\s+["'“]([^"'”]+)["'”]/;

function parseDirective(text){
  const low = text.toLowerCase();
  const c = {banned: []};
  let recognised = false;
  for (const [re, eff] of ADJUST) if (re.test(low)){ Object.assign(c, eff); recognised = true; }
  for (const [re, term] of BANS) if (re.test(low) && !c.banned.includes(term)){ c.banned.push(term); recognised = true; }
  const q = BANQ_RE.exec(low);
  if (q){ c.banned.push(q[1].trim()); recognised = true; }
  let persona = null;
  for (const name of Object.keys(PERSONAS)){
    if (new RegExp("\\b(try|switch to|be|go|sound|more)\\s+(the\\s+)?" + name + "\\b").test(low)){ persona = name; recognised = true; break; }
  }
  const m = LIKE_RE.exec(low);
  const like = m ? parseInt(m[1], 10) : null;
  if (like !== null) recognised = true;
  return {constraints: c, persona, like, standing: STANDING_RE.test(low), recognised};
}
function mergeConstraints(a, b){
  const out = {...a, banned: [...(a.banned || [])]};
  for (const k of ["maxChars","minChars","questions","numerals","maxSentences","emoji"])
    if (b[k] !== undefined) out[k] = b[k];
  for (const t of (b.banned || [])) if (!out.banned.includes(t)) out.banned.push(t);
  return out;
}
function describe(c){
  const out = [];
  if (c.maxChars != null) out.push("at most " + c.maxChars + " characters");
  if (c.minChars != null) out.push("at least " + c.minChars + " characters");
  if (c.questions === false) out.push("no questions");
  if (c.questions === true) out.push("always a question");
  if (c.numerals === false) out.push("no numbers");
  if (c.maxSentences != null) out.push("at most " + c.maxSentences + " sentence" + (c.maxSentences > 1 ? "s" : ""));
  if (c.emoji === false) out.push("no emoji");
  for (const b of (c.banned || [])) out.push("never say “" + b + "”");
  return out;
}
function allows(c, text){
  const n = text.length;
  if (c.maxChars != null && n > c.maxChars) return false;
  if (c.minChars != null && n < c.minChars) return false;
  if (c.questions === false && text.includes("?")) return false;
  if (c.questions === true && !text.includes("?")) return false;
  const digit = /\d/.test(text);
  if (c.numerals === false && digit) return false;
  if (c.numerals === true && !digit) return false;
  if (c.maxSentences != null && sentences(text).length > c.maxSentences) return false;
  if (c.emoji === false && EMOJI_RE.test(text)) return false;
  const low = text.toLowerCase();
  return !(c.banned || []).some(b => low.includes(b.toLowerCase()));
}

/* ---------- profile: per-viewer, in this browser ---------- */
const KEY = "thirsttrap.profile.v1";
const CONFIDENT_AFTER = 20, LR = .06;
const blank = () => ({persona:"flirt", weights:{...WEIGHTS}, standing:{banned:[]}, kept:[], keeps:0});
let P = blank();

function loadProfile(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object") return;
    if (PERSONAS[d.persona]) P.persona = d.persona;
    if (d.weights && typeof d.weights === "object") P.weights = normaliseWeights(d.weights);
    if (d.standing && typeof d.standing === "object") P.standing = {...d.standing, banned: Array.isArray(d.standing.banned) ? d.standing.banned : []};
    if (Array.isArray(d.kept)) P.kept = d.kept.filter(x => typeof x === "string").slice(-12);
    if (Number.isInteger(d.keeps) && d.keeps >= 0) P.keeps = d.keeps;
  } catch (e) { /* private window, blocked storage — start blank */ }
}
function saveProfile(){
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* not fatal */ }
}
function confidence(){
  if (!P.keeps) return "untuned";
  if (P.keeps < CONFIDENT_AFTER) return "barely tuned";
  return "tuned";
}
function learnFromKeep(chosen, others){
  P.keeps++;
  if (!others.length) return {};
  const before = normaliseWeights(P.weights);
  const updated = {...P.weights};
  for (const k in WEIGHTS){
    const avg = others.reduce((a, o) => a + (o[k] || 0), 0) / others.length;
    updated[k] = (updated[k] ?? WEIGHTS[k]) + LR * ((chosen[k] || 0) - avg);
  }
  P.weights = normaliseWeights(updated);
  const moved = {};
  for (const k in WEIGHTS) moved[k] = P.weights[k] - before[k];
  return moved;
}

/* ---------- generation ---------- */
let sample = null;
const state = {topic:null, turn:{banned:[]}, batch:[], busy:false, ctl:null, seeded:true};

function buildPrompt(topic, n, constraints, likeText){
  const lines = [
    "You write short-form posts for X (Twitter). Attention is won in the first five words and lost by trying too hard.",
    "", "Hard rules, no exceptions:", ...RULES_TXT.map(r => "- " + r),
    "", "Craft: specific beats general; say one thing; cut every word doing nothing. Make the candidates genuinely different from each other — two posts that could be edited into one another means one is wasted.",
    "", "Voice — " + state_persona() + ":", PERSONAS[P.persona],
  ];
  const standing = describe(P.standing);
  if (standing.length) lines.push("", "Standing preferences from this user:", ...standing.map(s => "- " + s));
  if (P.kept.length) lines.push("", "Posts this user kept. Match what these have in common, do not reuse their wording:", ...P.kept.slice(-6).map(k => "- " + k));
  const asked = describe(constraints);
  if (asked.length) lines.push("", "Requirements for every post:", ...asked.map(s => "- " + s));
  if (likeText) lines.push("", "Aim for the register of this one, without repeating it:", likeText);
  lines.push("", "Topic: " + topic,
             "", "Reply with only a JSON array of " + n + " strings, each one post. Example: [\"first post\", \"second post\"]");
  return lines.join("\n");
}
function state_persona(){ return P.persona.replace("_", " "); }

async function generate(topic, constraints, likeText){
  const prompt = buildPrompt(topic, 12, constraints, likeText);
  state.ctl = new AbortController();
  const data = await sample.json(prompt, {modelTier:"default", cache:false, signal:state.ctl.signal});
  if (!Array.isArray(data)) throw {code:"invalid_json", message:"expected an array"};
  return data.map(x => String(x).trim()).filter(Boolean);
}

const ERRORS = {
  not_granted:"Claude access wasn’t allowed for this page, so it can’t write posts. Scoring still works — paste a post with /score.",
  sampling_disabled:"Claude isn’t available on this account. Scoring still works.",
  not_declared:"This page no longer has Claude access.",
  rate_limited:"Too many requests. Wait a moment and try again.",
  session_expired:"Sign in to Claude again, then retry.",
  refused:"Claude declined that topic. Try describing it differently.",
  empty_completion:"Nothing came back. Try a more specific topic.",
  invalid_json:"The reply wasn’t usable. Try again.",
  cancelled:"Stopped.",
  upstream_error:"Something went wrong reaching Claude. Try again.",
};

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderStatus(){
  $("st-tune").innerHTML = "<b>" + confidence() + "</b> · " + P.keeps + " keep" + (P.keeps === 1 ? "" : "s") +
    " · voice <b>" + esc(state_persona()) + "</b>";
}
function renderRail(){
  const rules = describe(P.standing);
  $("rules").innerHTML = rules.length
    ? rules.map((r, i) => '<div class="rule"><button data-rule="' + i + '" title="Forget this rule" aria-label="Forget this rule">×</button><span>' + esc(r) + "</span></div>").join("")
    : '<p class="empty">None yet. Say “never use exclamation marks”.</p>';
  for (const b of $("rules").querySelectorAll("[data-rule]")) b.onclick = () => forgetRule(+b.dataset.rule);

  const w = normaliseWeights(P.weights);
  const max = Math.max(...Object.values(w));
  $("weights").innerHTML = Object.keys(WEIGHTS)
    .sort((a, b) => Math.abs(w[b] - WEIGHTS[b]) - Math.abs(w[a] - WEIGHTS[a]))
    .map(k => {
      const d = w[k] - WEIGHTS[k];
      const cls = Math.abs(d) < .0005 ? "" : (d > 0 ? "up" : "down");
      const sign = d > 0 ? "+" : (d < 0 ? "−" : " ");
      return '<div class="wrow"><span>' + SHORT[k] + '</span>' +
             '<span class="wtrack"><span class="wfill" style="width:' + (100 * w[k] / max).toFixed(0) + '%"></span></span>' +
             '<span class="wdelta ' + cls + '">' + (cls ? sign + Math.abs(d).toFixed(3) : "—") + "</span></div>";
    }).join("");

  $("kept").innerHTML = P.kept.length
    ? P.kept.slice().reverse().map(k => '<div class="keptline">' + esc(k) + "</div>").join("")
    : '<p class="empty">Nothing kept yet.</p>';
}

function componentBars(sc){
  return '<div class="bars">' + Object.keys(WEIGHTS)
    .sort((a, b) => WEIGHTS[b] - WEIGHTS[a])
    .map(k => '<div class="cbar"><span>' + k.replace("_", " ") + '</span>' +
      '<span class="track"><span class="fill" style="width:' + (100 * sc.components[k]).toFixed(0) + '%"></span></span>' +
      '<span class="n">' + sc.components[k].toFixed(2) + "</span></div>").join("") + "</div>";
}

function renderBatch(container, items, isExample){
  container.innerHTML = items.map((it, i) => {
    const flags = it.score.notes.map(n => '<span class="flag warn">' + esc(n) + "</span>").join("");
    return '<div class="post" data-i="' + i + '">' +
      '<div class="rankno"><span class="score">' + it.final.toFixed(1) + "<small>score</small></span></div>" +
      '<div><div class="body">' + esc(it.text) + "</div>" +
      '<div class="row">' +
        '<span class="chars">' + it.text.length + "/280</span>" +
        (it.dup ? '<span class="flag">near-duplicate</span>' : "") +
        '<button class="why" data-why="' + i + '">Why</button>' +
        '<button class="keep" data-keep="' + i + '"' + (isExample ? " disabled" : "") + ">Keep</button>" +
      "</div>" + (flags ? '<div class="row notes">' + flags + "</div>" : "") +
      "<div data-bars=\"" + i + '" hidden></div></div></div>';
  }).join("");

  for (const b of container.querySelectorAll("[data-why]")) b.onclick = () => {
    const box = container.querySelector('[data-bars="' + b.dataset.why + '"]');
    if (box.hasChildNodes()) { box.hidden = !box.hidden; return; }
    box.innerHTML = componentBars(items[+b.dataset.why].score);
    box.hidden = false;
  };
  for (const b of container.querySelectorAll("[data-keep]")) b.onclick = () => keep(+b.dataset.keep, b);
}

function addTurn(said, items, isExample){
  const div = document.createElement("div");
  div.className = "turn";
  div.innerHTML = '<div class="said"><span class="caret">&gt;</span><span class="words">' + esc(said) + "</span>" +
                  (isExample ? '<span class="tag">example</span>' : "") + "</div><div class='batch'></div>";
  $("stream").append(div);
  renderBatch(div.querySelector(".batch"), items, isExample);
  state.batch = isExample ? [] : items;
  div.scrollIntoView({behavior:"smooth", block:"nearest"});
  return div;
}

function note(text){ $("msg").hidden = !text; $("msg").textContent = text || ""; }

/* ---------- actions ---------- */
function keep(i, btn){
  const item = state.batch[i];
  if (!item) return;
  if (P.kept.includes(item.text)) { note("Already kept."); return; }
  P.kept.push(item.text);
  if (P.kept.length > 12) P.kept.shift();
  const others = state.batch.filter((_, j) => j !== i).map(x => x.score.components);
  const moved = learnFromKeep(item.score.components, others);
  saveProfile(); renderRail(); renderStatus();
  btn.disabled = true; btn.textContent = "Kept";
  const top = Object.entries(moved).filter(([, v]) => Math.abs(v) > .0005)
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 2)
    .map(([k, v]) => k.replace("_", " ") + " " + (v > 0 ? "+" : "−") + Math.abs(v).toFixed(3));
  note(top.length ? "Learned: " + top.join(", ") + " · " + confidence() + " on " + P.keeps + " keeps"
                  : "Kept. Too similar to the others to teach anything.");
}
function forgetRule(index){
  const list = describe(P.standing);
  const clause = list[index];
  const bans = P.standing.banned || [];
  const banIdx = bans.findIndex(b => clause === "never say “" + b + "”");
  if (banIdx >= 0) bans.splice(banIdx, 1);
  else {
    for (const [k, test] of [["maxChars", "at most"], ["minChars", "at least"], ["questions", "question"],
                             ["numerals", "numbers"], ["maxSentences", "sentence"], ["emoji", "emoji"]])
      if (clause.includes(test)) { delete P.standing[k]; break; }
  }
  saveProfile(); renderRail(); note("Forgot: " + clause);
}

async function send(raw){
  const line = raw.trim();
  if (!line || state.busy) return;

  const d = parseDirective(line);
  if (d.persona) P.persona = d.persona;

  let likeText = null;
  if (d.like !== null){
    if (!state.batch.length) { note("No batch yet — write a topic first."); return; }
    if (d.like < 1 || d.like > state.batch.length) { note("Pick 1–" + state.batch.length + "."); return; }
    likeText = state.batch[d.like - 1].text;
  }

  if (Object.keys(d.constraints).length > 1 || d.constraints.banned.length){
    if (d.standing){
      const before = describe(P.standing);
      P.standing = mergeConstraints(P.standing, d.constraints);
      const added = describe(P.standing).filter(c => !before.includes(c));
      if (added.length) note("Standing rule: " + added.join(", ") + " — remove it in the rail.");
    } else {
      state.turn = mergeConstraints(state.turn, d.constraints);
    }
  }

  if (!d.recognised){ state.topic = line; state.turn = {banned: []}; }
  else if (!state.topic){ note("Say what the posts should be about first."); return; }

  if (!sample){
    note(ERRORS.not_granted);
    saveProfile(); renderRail(); renderStatus();
    return;
  }

  const constraints = mergeConstraints(P.standing, state.turn);
  state.busy = true; $("go").disabled = true; $("pending").hidden = false; note("");

  try {
    const raws = await generate(state.topic, constraints, likeText);
    const allowed = raws.filter(t => allows(constraints, t));
    if (!allowed.length){
      note(raws.length
        ? "Nothing came back that fits: " + describe(constraints).join(", ") + ". Loosen it, or say the topic again to reset this turn."
        : "Nothing came back. Try a more specific topic.");
      return;
    }
    let items = rank(allowed, P.weights);
    if (likeText){
      for (const it of items) it.final += 60 * similarity(it.text, likeText);
      items.sort((a, b) => b.final - a.final);
    }
    if (state.seeded){ $("stream").innerHTML = ""; state.seeded = false; }
    addTurn(line, items.slice(0, 5), false);
    if (raws.length > allowed.length) note((raws.length - allowed.length) + " dropped for breaking: " + describe(constraints).join(", "));
  } catch (e){
    const code = e && e.code ? e.code : "upstream_error";
    if (code !== "cancelled") note(ERRORS[code] || ERRORS.upstream_error);
  } finally {
    state.busy = false; $("go").disabled = false; $("pending").hidden = true;
    saveProfile(); renderRail(); renderStatus();
    $("line").focus();
  }
}

/* ---------- boot ---------- */
const EXAMPLE = [
  "Nobody tells you the best part of quitting. It’s the silence at 4pm.",
  "You already know the answer. You’re just waiting for someone to say it out loud.",
  "Three years of pretending that meeting mattered. Gone in one sentence.",
  "let that sink in — quitting is a game changer!!! #newchapter #blessed",
];
const QUICK = ["shorter", "no questions", "one line", "more like 1", "try deadpan", "never use exclamation marks"];

loadProfile();
renderRail(); renderStatus();
$("quick").innerHTML = QUICK.map(q => "<button data-q=\"" + esc(q) + '">' + esc(q) + "</button>").join("");
for (const b of $("quick").querySelectorAll("[data-q]")) b.onclick = () => { $("line").value = b.dataset.q; $("line").focus(); };
addTurn("finally quitting the job", rank(EXAMPLE, P.weights).slice(0, 4), true);

$("form").onsubmit = e => { e.preventDefault(); const v = $("line").value; $("line").value = ""; send(v); };

(async () => {
  sample = window.claude ? await window.claude.use("sample") : null;
  $("st-engine").innerHTML = sample
    ? "writing with <b>Claude</b> · scored in this page"
    : "<b>scoring only</b> — Claude unavailable here";
})();
</script>
