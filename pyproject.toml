[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thirsttrap"
version = "0.2.0"
description = "Generate candidate posts for X locally and rank them by a learned prior."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
thirsttrap = "thirsttrap.cli:main"

[tool.setuptools.packages.find]
include = ["thirsttrap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
