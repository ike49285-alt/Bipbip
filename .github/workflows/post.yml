name: post

# Runs on GitHub's machines, so the bot needs no computer of its own.
# Credentials are repository secrets: encrypted, and unreadable from a fork.
on:
  schedule:
    - cron: "17 18 * * *"   # 18:17 UTC, off the hour so it isn't in the stampede
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually post it (leave off for a dry run)"
        type: boolean
        default: false

concurrency:
  group: post
  cancel-in-progress: false   # never interrupt a run that may already have posted

permissions:
  contents: write             # only to commit posted.json back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAPTION_URL: ${{ vars.CAPTION_URL }}
      CAPTION_MODEL: ${{ vars.CAPTION_MODEL }}
      CAPTION_KEY: ${{ secrets.CAPTION_KEY }}
      IMAGE_URL: ${{ vars.IMAGE_URL }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
      IMAGE_KEY: ${{ secrets.IMAGE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies, so there is nothing to install.
      - run: python -m pytest tests/ -q

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: python -m bot --out preview.jpg --show

      # Committed rather than uploaded as an artifact: a zip is awkward to open
      # on a phone, and a committed JPEG renders inline on github.com.
      - name: Commit the preview so it can be looked at
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f preview.jpg
          git commit -m "preview $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git push

      - name: Post
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m bot --post

      # The runner is thrown away, so the log of what she has already said has
      # to come back to the repo or she starts repeating herself every run.
      - name: Remember what was posted
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add posted.json
            git commit -m "posted $(date -u +%Y-%m-%d)"
            git push
          fi
