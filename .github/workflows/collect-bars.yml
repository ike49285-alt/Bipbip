name: Collect intraday bars

# Free providers only serve a trailing ~30-day window of one-minute bars, which
# is far too short to validate a one-trade-per-day system. This job runs after
# the close and merges each fetch into the committed archive, so history
# accumulates without needing a machine left switched on.

on:
  schedule:
    # 22:30 UTC on weekdays: comfortably after the close in both EST (17:30
    # local) and EDT (18:30 local), so the session's final bars have settled.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols to fetch"
        required: false
        default: "SPY TQQQ"

permissions:
  contents: write

concurrency:
  # Never let two runs race to commit the same archive.
  group: collect-bars
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch bars
        id: fetch
        # Always request the full 30-day window rather than just yesterday. It
        # costs a few extra requests and makes the job self-healing: a run that
        # is skipped, delayed, or fails leaves no permanent hole in the archive.
        run: |
          python -m bipbip.cli fetch \
            --symbols ${{ github.event.inputs.symbols || 'SPY TQQQ' }} \
            --lookback 30

      - name: Fetch daily and hourly context
        if: always()
        # Daily bars have no trailing-window limit, so this pulls the full
        # history in one request - SPY back to 1993, TQQQ to 2010. Hourly
        # reaches two years. Neither can validate an intraday strategy, but
        # both supply the regime context the 30-day minute archive can never
        # hold. `if: always()` because context is still worth having on a day
        # the minute fetch fails.
        run: |
          python -m bipbip.cli fetch \
            --symbols ${{ github.event.inputs.symbols || 'SPY TQQQ' }} \
            --bar-size 1d
          python -m bipbip.cli fetch \
            --symbols ${{ github.event.inputs.symbols || 'SPY TQQQ' }} \
            --bar-size 1h

      - name: Fetch the daily universe
        if: always()
        # Daily bars for the whole universe. Unlike minute data this needs no
        # accumulating - the full history is re-fetchable at any time - but it
        # is committed so backtests can run without a network round trip.
        run: |
          python -m bipbip.cli fetch --universe liquid --bar-size 1d

      - name: Fetch the hourly universe
        if: always()
        # The largest unforced gap this collector had. It was written for two
        # symbols and never widened when the universe grew to 305, so the
        # archive held 305 daily series and TWO intraday ones - which is why
        # every intraday test in this project has been single-symbol, and why
        # the cross-sectional intraday question went unasked rather than
        # unanswered.
        #
        # Yahoo serves 730 days of hourly bars, so this needs no accumulating
        # either: two years arrives on the first run for every symbol at once.
        run: |
          python -m bipbip.cli fetch --universe liquid --bar-size 1h

      - name: Fetch minute bars for the whole universe
        if: always()
        # Minute history IS trailing-window-limited, so this one accumulates and
        # only time makes it deep.
        #
        # It covers all 305 symbols rather than just the ETFs, because
        # survivorship contamination scales with LOOKBACK and this window is 29
        # days. The stock lists are unusable over 34 years - every company that
        # failed is missing from a 2026 membership list - but over the last
        # month every one of them demonstrably existed and traded. The bias
        # that makes those symbols worthless for a decade-long backtest is
        # close to absent at this horizon.
        #
        # Five requests a symbol at 7-day chunks, so this is the expensive step;
        # it is last so a throttle here cannot cost the cheaper fetches above.
        run: |
          python -m bipbip.cli fetch --universe liquid --bar-size 1m --lookback 29

      - name: Fetch non-price data
        if: always()
        # Earnings dates and sector membership are information the price series
        # cannot encode. The news step is a PROBE rather than a fetch: it
        # reports what is actually retrievable, because historical per-ticker
        # news is widely assumed to be free and is not.
        run: |
          python -m bipbip.cli fundamentals --universe largecap250 --what all

      - name: Report coverage
        if: always()
        # --require-data fails the run when the archive is still empty. A
        # collector whose provider blocks the runner would otherwise report
        # "no new bars" and exit green, and a silently broken scheduled job is
        # worse than a failing one because nobody goes looking for it.
        run: |
          python -m bipbip.cli coverage --require-data
          python -m bipbip.cli coverage --bar-size 1d || true
          python -m bipbip.cli coverage --bar-size 1h || true
          python -m bipbip.cli coverage --bar-size 1m || true

      - name: Verify the daily archive is total-return
        if: always()
        # The daily bars were stored price-only for the whole life of this
        # project: dividends were discarded, so SHY read 81.01 -> 81.66 across
        # 24 years and every backtest measured strategies against a benchmark
        # missing its own yield. Nothing failed - the data simply looked
        # plausible and was wrong. This asserts the property directly, so a
        # revert to unadjusted prices breaks the job instead of the research.
        run: |
          python - <<'EOF'
          import sys
          from bipbip.data.store import BarStore

          store = BarStore("data/bars")
          # Short Treasuries: almost all return arrives as coupons, so the
          # price-only series is nearly flat and the adjusted one is not.
          bad = []
          for sym, floor in (("SHY", 0.15), ("TLT", 0.40), ("AGG", 0.40)):
              bars = store.load(sym, "1d")
              if bars.empty:
                  print(f"{sym}: not in the archive, skipping")
                  continue
              first, last = float(bars["close"].iloc[0]), float(bars["close"].iloc[-1])
              total = last / first - 1.0
              years = (bars.index[-1] - bars.index[0]).days / 365.25
              print(f"{sym}: {first:.2f} -> {last:.2f} over {years:.1f}y = {total:+.1%}")
              if total < floor:
                  bad.append(f"{sym} returned {total:+.1%} over {years:.1f}y, "
                             f"below the {floor:.0%} a coupon-paying fund must clear")
          if bad:
              print("\nDaily bars look price-only, not total-return:", file=sys.stderr)
              for b in bad:
                  print(f"  - {b}", file=sys.stderr)
              print("Check auto_adjust on the daily fetch path.", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Commit new bars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage BEFORE checking. `git diff` ignores untracked files, so on the
          # first run - when every parquet file is new - it reports no changes
          # and the whole archive is discarded when the runner is destroyed.
          # Checking the index instead sees new files and modifications alike.
          git add data/bars data/fundamentals
          if git diff --cached --quiet -- data/bars data/fundamentals; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Archive market data for $(date -u +%Y-%m-%d)"
          data_commit="$(git rev-parse HEAD)"

          # Replay this run's archive onto the remote tip rather than rebasing
          # onto it. Parquet files cannot be three-way merged, so a rebase
          # conflicts on EVERY file the other side also touched: one run lost a
          # complete refetch of 309 symbols to 300 simultaneous binary
          # conflicts. There is no meaningful merge of two versions of a bar
          # archive anyway - the fresher fetch is simply the better one, since
          # every daily fetch pulls the instrument's full history.
          for attempt in 1 2 3; do
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "Fetch attempt ${attempt} failed; retrying."
              sleep $((attempt * 5))
              continue
            fi
            git reset --hard "origin/${GITHUB_REF_NAME}"
            # The commit object survives the reset; take the data back out of it.
            git checkout "${data_commit}" -- data/bars data/fundamentals
            git add data/bars data/fundamentals
            if git diff --cached --quiet; then
              echo "Remote already holds this archive."
              exit 0
            fi
            git commit -m "Archive market data for $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done
          echo "Could not push the archive after 3 attempts." >&2
          exit 1
