name: Collect intraday bars

# Free providers only serve a trailing ~30-day window of one-minute bars, which
# is far too short to validate a one-trade-per-day system. This job runs after
# the close and merges each fetch into the committed archive, so history
# accumulates without needing a machine left switched on.

on:
  schedule:
    # 22:30 UTC on weekdays: comfortably after the close in both EST (17:30
    # local) and EDT (18:30 local), so the session's final bars have settled.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols to fetch"
        required: false
        default: "SPY TQQQ"

permissions:
  contents: write

concurrency:
  # Never let two runs race to commit the same archive.
  group: collect-bars
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch bars
        id: fetch
        # Always request the full 30-day window rather than just yesterday. It
        # costs a few extra requests and makes the job self-healing: a run that
        # is skipped, delayed, or fails leaves no permanent hole in the archive.
        run: |
          python -m bipbip.cli fetch \
            --symbols ${{ github.event.inputs.symbols || 'SPY TQQQ' }} \
            --lookback 30

      - name: Fetch daily and hourly context
        if: always()
        # Daily bars have no trailing-window limit, so this pulls the full
        # history in one request - SPY back to 1993, TQQQ to 2010. Hourly
        # reaches two years. Neither can validate an intraday strategy, but
        # both supply the regime context the 30-day minute archive can never
        # hold. `if: always()` because context is still worth having on a day
        # the minute fetch fails.
        run: |
          python -m bipbip.cli fetch \
            --symbols ${{ github.event.inputs.symbols || 'SPY TQQQ' }} \
            --bar-size 1d
          python -m bipbip.cli fetch \
            --symbols ${{ github.event.inputs.symbols || 'SPY TQQQ' }} \
            --bar-size 1h

      - name: Fetch the daily universe
        if: always()
        # Daily bars for the whole universe. Unlike minute data this needs no
        # accumulating - the full history is re-fetchable at any time - but it
        # is committed so backtests can run without a network round trip.
        run: |
          python -m bipbip.cli fetch --universe everything --bar-size 1d

      - name: Report coverage
        if: always()
        # --require-data fails the run when the archive is still empty. A
        # collector whose provider blocks the runner would otherwise report
        # "no new bars" and exit green, and a silently broken scheduled job is
        # worse than a failing one because nobody goes looking for it.
        run: |
          python -m bipbip.cli coverage --require-data
          python -m bipbip.cli coverage --bar-size 1d || true
          python -m bipbip.cli coverage --bar-size 1h || true

      - name: Commit new bars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage BEFORE checking. `git diff` ignores untracked files, so on the
          # first run - when every parquet file is new - it reports no changes
          # and the whole archive is discarded when the runner is destroyed.
          # Checking the index instead sees new files and modifications alike.
          git add data/bars
          if git diff --cached --quiet -- data/bars; then
            echo "No new bars - nothing to commit."
            exit 0
          fi
          git commit -m "Archive intraday bars for $(date -u +%Y-%m-%d)"
          # Rebase onto any concurrent push before writing back.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done
          echo "Could not push the archive after 3 attempts." >&2
          exit 1
